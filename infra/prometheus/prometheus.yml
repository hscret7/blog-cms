global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

  external_labels:
    project: blog-cms
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          project: blog-cms
  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113
        labels:
          project: blog-cms
  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104
        labels:
          project: blog-cms
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          project: blog-cms

    metric_relabel_configs:
      - source_labels:
          - container_label_com_docker_compose_project
        regex: blog-cms
        action: keep