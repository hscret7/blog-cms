# Log metadata only: no query string, cookies, request body or Authorization.
log_format blog_cms_json escape=json
    '{"ts":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"duration":$request_time,"bytes":$body_bytes_sent}';
map $uri $blog_cms_loggable {
    default 1;
    /health/live 0;
    /health/ready 0;
}

server {
    listen 80;
    server_name localhost;

    server_tokens off;

    client_max_body_size 6m;
    client_body_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /dev/stdout blog_cms_json if=$blog_cms_loggable;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $application http://app:3000;
        proxy_pass $application;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_hide_header X-Content-Type-Options;
    }
}
# Trang thống kê nội bộ dành cho exporter.
server {
    listen 8080;
    server_name _;

    server_tokens off;

    access_log off;
    error_log /dev/stderr warn;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
