server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 30s
      max_retries: 10

scrape_configs:
  - job_name: blog-cms-containers
    file_sd_configs:
      - files:
          - /etc/promtail/targets/containers.json
        refresh_interval: 10s
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 168h
          drop_counter_reason: outside_retention
      # Do not retain URI query parameters present in older access/error logs.
      - replace:
          expression: '\?([^ "\t\r\n]+)'
          replace: '?REDACTED'
      - match:
          selector: '{project="blog-cms", service="nginx"}'
          stages:
            - json:
                expressions:
                  path: path
            - drop:
                source: path
                expression: '^/health/(live|ready)$'
                drop_counter_reason: healthcheck
    relabel_configs:
      - source_labels: [project]
        regex: blog-cms
        action: keep
      - source_labels: [service]
        regex: app|nginx|mysql|phpmyadmin
        action: keep
