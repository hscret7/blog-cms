services:
  app:
    image: blog-cms-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      TRUSTED_PROXY_IP: 172.26.0.10
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Chua_dat_MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Chua_dat_MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Chua_dat_MYSQL_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Chua_dat_SESSION_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18090}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

    expose:
      - "3000"

    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false

    networks:
      - database
      - proxy

    depends_on:
      mysql:
        condition: service_healthy

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:18090:80"

    volumes:
      - type: bind
        source: ./infra/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

    networks:
      proxy:
        ipv4_address: 172.26.0.10
      monitoring: {}

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped

    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status

    networks:
      - monitoring

    depends_on:
      nginx:
        condition: service_healthy

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    user: "1000:1000"

    command:
      - --config.my-cnf=/etc/mysql-exporter.cnf
      - --mysqld.address=mysql:3306

    volumes:
      - type: bind
        source: ./secrets/mysql-exporter.cnf
        target: /etc/mysql-exporter.cnf
        read_only: true
        bind:
          create_host_path: false

    networks:
      - database
      - monitoring

    depends_on:
      mysql:
        condition: service_healthy

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    privileged: true

    devices:
      - /dev/kmsg:/dev/kmsg

    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - monitoring

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    user: "1000:1000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console

    ports:
      - "127.0.0.1:13000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ./secrets/grafana-admin-password
        target: /run/secrets/grafana-admin-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false

    networks:
      - monitoring

    depends_on:
      prometheus:
        condition: service_healthy

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB

    ports:
      - "127.0.0.1:19090:9090"

    volumes:
      - type: bind
        source: ./infra/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus

    networks:
      - monitoring

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Chua_dat_MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Chua_dat_MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Chua_dat_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Chua_dat_MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00

    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:?Chua_dat_MYSQL_HOST_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - database

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1;" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"

    ports:
      - "127.0.0.1:${PHPMYADMIN_HOST_PORT:?Chua_dat_PHPMYADMIN_HOST_PORT}:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - database

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  database:
    driver: bridge

  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24
          gateway: 172.26.0.1

  monitoring:
    driver: bridge